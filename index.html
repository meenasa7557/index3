<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doraemon Welcome</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>🌐 My GitHub Project</h2>
    </header>

    <main class="hero">

        <div class="content">

            <p class="small-title">WELCOME TO MY WEBSITE</p>

            <h1>Hello Everyone! 👋</h1>

            <h2>Welcome to My Doraemon World 💙</h2>

            <p>
                This website is created as a demonstration
                of GitHub and Vercel deployment.
            </p>

            <button onclick="showMessage()">
                Welcome
            </button>

            <p id="message"></p>

        </div>

        <div class="image-box">

            <img
                src="https://upload.wikimedia.org/wikipedia/en/b/bd/Doraemon_character.png"
                alt="Doraemon"
            >

        </div>

    </main>

    <footer>
        <p>Created using HTML, CSS, JavaScript, GitHub & Vercel</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
